<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Quiz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>Math Quiz</h1>

  <section id="start-screen">
    <p>Answer as many questions as you can before time runs out!</p>
    <label>Difficulty
      <select id="difficulty">
        <option value="1">Easy (+ −)</option>
        <option value="2" selected>Medium (+ − ×)</option>
        <option value="3">Hard (+ − × ÷, bigger numbers)</option>
      </select>
    </label>
    <p class="best">Best score: <span id="best">0</span></p>
    <button id="start-btn">Start</button>
  </section>

  <section id="game-screen" hidden>
    <div class="stats">
      <span>Time: <b id="time">60</b>s</span>
      <span>Score: <b id="score">0</b></span>
      <span>Streak: <b id="streak">0</b></span>
    </div>
    <div class="timebar"><div id="timebar-fill"></div></div>
    <div id="question" class="question"></div>
    <form id="answer-form">
      <input id="answer" type="number" inputmode="numeric" autocomplete="off" required>
      <button type="submit">Go</button>
    </form>
    <div id="feedback" class="feedback" aria-live="polite"></div>
  </section>

  <section id="end-screen" hidden>
    <h2>Time's up!</h2>
    <p>Score: <b id="final-score">0</b></p>
    <p>Correct: <b id="final-correct">0</b> / <b id="final-total">0</b></p>
    <p id="new-best" class="best" hidden>🏆 New best score!</p>
    <button id="restart-btn">Play again</button>
  </section>
</main>
<script src="game.js"></script>
</body>
</html>
